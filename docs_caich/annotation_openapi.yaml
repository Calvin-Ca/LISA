  "components": {
    "schemas": {
      "Asset": {
        "properties": {
          "asset_id": {
            "type": "string",
            "title": "Asset Id"
          },
          "source_id": {
            "type": "string",
            "title": "Source Id"
          },
          "group_id": {
            "type": "string",
            "title": "Group Id"
          },
          "width": {
            "type": "integer",
            "minimum": 1.0,
            "title": "Width"
          },
          "height": {
            "type": "integer",
            "minimum": 1.0,
            "title": "Height"
          },
          "sha256": {
            "type": "string",
            "title": "Sha256"
          },
          "media_type": {
            "type": "string",
            "enum": [
              "image/jpeg",
              "image/png"
            ],
            "title": "Media Type"
          },
          "content_url": {
            "type": "string",
            "title": "Content Url"
          },
          "duplicate_of": {
            "type": "string",
            "title": "Duplicate Of"
          },
          "metadata": {
            "type": "object",
            "title": "Metadata"
          },
          "created_at": {
            "type": "string",
            "format": "date-time",
            "title": "Created At"
          }
        },
        "additionalProperties": false,
        "type": "object",
        "required": [
          "asset_id",
          "group_id",
          "width",
          "height",
          "sha256",
          "media_type",
          "content_url",
          "created_at"
        ],
        "title": "Asset"
      },
      "Body_createAsset": {
        "properties": {
          "file": {
            "type": "string",
            "format": "binary",
            "title": "File"
          },
          "group_id": {
            "type": "string",
            "maxLength": 256,
            "minLength": 1,
            "title": "Group Id"
          },
          "source_id": {
            "type": "string",
            "maxLength": 256,
            "title": "Source Id"
          },
          "metadata_json": {
            "type": "string",
            "maxLength": 16384,
            "title": "Metadata Json"
          }
        },
        "type": "object",
        "required": [
          "file",
          "group_id"
        ],
        "title": "Body_createAsset"
      },
      "CreateJobRequest": {
        "properties": {
          "asset_ids": {
            "items": {
              "type": "string"
            },
            "type": "array",
            "maxItems": 500,
            "minItems": 1,
            "title": "Asset Ids"
          },
          "grounding_prompt": {
            "type": "string",
            "maxLength": 2000,
            "minLength": 1,
            "title": "Grounding Prompt"
          },
          "pipeline_version": {
            "type": "string",
            "maxLength": 128,
            "minLength": 1,
            "title": "Pipeline Version",
            "default": "groundingdino-free-form-v1"
          }
        },
        "additionalProperties": false,
        "type": "object",
        "required": [
          "asset_ids",
          "grounding_prompt"
        ],
        "title": "CreateJobRequest"
      },
      "DetectionJobProgress": {
        "properties": {
          "total_assets": {
            "type": "integer",
            "minimum": 0.0,
            "title": "Total Assets"
          },
          "completed_assets": {
            "type": "integer",
            "minimum": 0.0,
            "title": "Completed Assets"
          }
        },
        "additionalProperties": false,
        "type": "object",
        "required": [
          "total_assets",
          "completed_assets"
        ],
        "title": "DetectionJobProgress"
      },
      "ErrorCode": {
        "type": "string",
        "enum": [
          "validation_error",
          "annotation_validation_failed",
          "unauthorized",
          "forbidden",
          "not_found",
          "version_conflict",
          "idempotency_conflict",
          "invalid_state_transition",
          "unsupported_media_type",
          "request_too_large",
          "queue_full",
          "model_unavailable",
          "downstream_unavailable",
          "internal_error"
        ],
        "title": "ErrorCode",
        "description": "An enumeration."
      },
      "ErrorDetail": {
        "properties": {
          "field": {
            "type": "string",
            "title": "Field"
          },
          "reason": {
            "type": "string",
            "title": "Reason"
          }
        },
        "additionalProperties": false,
        "type": "object",
        "required": [
          "reason"
        ],
        "title": "ErrorDetail"
      },
      "ErrorPayload": {
        "properties": {
          "request_id": {
            "type": "string",
            "title": "Request Id"
          },
          "code": {
            "$ref": "#/components/schemas/ErrorCode"
          },
          "message": {
            "type": "string",
            "title": "Message"
          },
          "details": {
            "items": {
              "$ref": "#/components/schemas/ErrorDetail"
            },
            "type": "array",
            "title": "Details"
          }
        },
        "additionalProperties": false,
        "type": "object",
        "required": [
          "code",
          "message"
        ],
        "title": "ErrorPayload"
      },
      "HTTPValidationError": {
        "properties": {
          "detail": {
            "items": {
              "$ref": "#/components/schemas/ValidationError"
            },
            "type": "array",
            "title": "Detail"
          }
        },
        "type": "object",
        "title": "HTTPValidationError"
      },
      "HealthResponse": {
        "properties": {
          "status": {
            "type": "string",
            "enum": [
              "ok"
            ],
            "title": "Status",
            "default": "ok"
          }
        },
        "additionalProperties": false,
        "type": "object",
        "title": "HealthResponse"
      },
      "Job": {
        "properties": {
          "job_id": {
            "type": "string",
            "title": "Job Id"
          },
          "status": {
            "$ref": "#/components/schemas/JobStatus"
          },
          "stage": {
            "type": "string",
