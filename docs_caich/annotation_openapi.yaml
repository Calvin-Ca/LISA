openapi: 3.0.3
info:
  title: LISA Construction Safety Annotation API
  version: 1.0.0
  description: |
    GroundingDINO + SAM + Qwen assisted annotation service.
    Coordinates use absolute pixels in the original image coordinate system.
servers:
  - url: /
security:
  - bearerAuth: []
  - apiKeyAuth: []
tags:
  - name: Service
  - name: Assets
  - name: Jobs
  - name: Tasks
  - name: Releases
paths:
  /health:
    get:
      tags: [Service]
      operationId: getHealth
      security: []
      responses:
        "200":
          description: Process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /ready:
    get:
      tags: [Service]
      operationId: getReadiness
      responses:
        "200":
          description: Service and required dependencies are ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          description: One or more required dependencies are not ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
  /v1/annotation/assets:
    post:
      tags: [Assets]
      operationId: createAsset
      summary: Upload and register one source image.
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, group_id]
              properties:
                file:
                  type: string
                  format: binary
                  description: JPEG or PNG image.
                source_id:
                  type: string
                  maxLength: 256
                group_id:
                  type: string
                  minLength: 1
                  maxLength: 256
                  description: Video, sequence, site, or other split-isolation group.
                metadata_json:
                  type: string
                  maxLength: 16384
                  description: Optional JSON object encoded as a UTF-8 string.
      responses:
        "201":
          description: Asset created or an idempotent prior result returned.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationError"
  /v1/annotation/assets/{asset_id}:
    get:
      tags: [Assets]
      operationId: getAsset
      parameters:
        - $ref: "#/components/parameters/AssetId"
        - $ref: "#/components/parameters/RequestIdHeader"
      responses:
        "200":
          description: Asset metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/annotation/assets/{asset_id}/content:
    get:
      tags: [Assets]
      operationId: getAssetContent
      parameters:
        - $ref: "#/components/parameters/AssetId"
        - $ref: "#/components/parameters/RequestIdHeader"
      responses:
        "200":
          description: Original JPEG or PNG bytes.
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/annotation/jobs:
    post:
      tags: [Jobs]
      operationId: createAnnotationJob
      summary: Queue an asynchronous automatic annotation job.
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateJobRequest"
      responses:
        "202":
          description: Job accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "409":
          $ref: "#/components/responses/Conflict"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/QueueFull"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/annotation/jobs/{job_id}:
    get:
      tags: [Jobs]
      operationId: getAnnotationJob
      parameters:
        - $ref: "#/components/parameters/JobId"
        - $ref: "#/components/parameters/RequestIdHeader"
      responses:
        "200":
          description: Job status and generated task IDs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/annotation/jobs/{job_id}/detections:
    get:
      tags: [Jobs]
      operationId: listAnnotationJobDetections
      summary: List GroundingDINO detections generated for a job.
      parameters:
        - $ref: "#/components/parameters/JobId"
        - $ref: "#/components/parameters/RequestIdHeader"
        - name: asset_id
          in: query
          required: false
          description: Limit results to one asset belonging to the job.
          schema:
            type: string
            minLength: 1
            maxLength: 128
      responses:
        "200":
          description: Detection boxes in stable job asset order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobDetectionsResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/annotation/jobs/{job_id}/hazard-candidates:
    get:
      tags: [Jobs]
      operationId: listAnnotationJobHazardCandidates
      summary: List explainable hazard candidates derived from detections.
      parameters:
        - $ref: "#/components/parameters/JobId"
        - $ref: "#/components/parameters/RequestIdHeader"
        - name: asset_id
          in: query
          required: false
          description: Limit results to one asset belonging to the job.
          schema:
            type: string
            minLength: 1
            maxLength: 128
      responses:
        "200":
          description: Hazard candidates in stable asset and rule order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobHazardCandidatesResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/annotation/jobs/{job_id}/review-tasks:
    post:
      tags: [Jobs]
      operationId: buildAnnotationReviewTasks
      summary: Idempotently build manual review tasks from hazard candidates.
      parameters:
        - $ref: "#/components/parameters/JobId"
        - $ref: "#/components/parameters/RequestIdHeader"
      responses:
        "200":
          description: Existing and newly created review task IDs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuildReviewTasksResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/annotation/tasks:
    get:
      tags: [Tasks]
      operationId: listAnnotationTasks
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/TaskStatus"
        - name: category
          in: query
          schema:
            $ref: "#/components/schemas/AnnotationCategory"
        - name: group_id
          in: query
          schema:
            type: string
            maxLength: 256
        - name: job_id
          in: query
          schema:
            type: string
        - name: annotator_id
          in: query
          schema:
            type: string
        - name: reviewer_id
          in: query
          schema:
            type: string
        - name: bad_case_type
          in: query
          schema:
            $ref: "#/components/schemas/BadCaseType"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Cursor-paginated annotation tasks.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskList"
        "422":
          $ref: "#/components/responses/ValidationError"
  /v1/annotation/tasks/{task_id}:
    get:
      tags: [Tasks]
      operationId: getAnnotationTask
      parameters:
        - $ref: "#/components/parameters/TaskId"
        - $ref: "#/components/parameters/RequestIdHeader"
      responses:
        "200":
          description: Complete review task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnnotationTask"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/annotation/tasks/{task_id}/versions:
    get:
      tags: [Tasks]
      operationId: listAnnotationTaskVersions
      parameters:
        - $ref: "#/components/parameters/TaskId"
        - $ref: "#/components/parameters/RequestIdHeader"
      responses:
        "200":
          description: Immutable task annotation version history.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskVersionList"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/annotation/tasks/{task_id}/reviews:
    get:
      tags: [Tasks]
      operationId: listAnnotationTaskReviews
      parameters:
        - $ref: "#/components/parameters/TaskId"
        - $ref: "#/components/parameters/RequestIdHeader"
      responses:
        "200":
          description: Immutable review decision history.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewList"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/annotation/tasks/{task_id}/draft:
    put:
      tags: [Tasks]
      operationId: saveAnnotationDraft
      parameters:
        - $ref: "#/components/parameters/TaskId"
        - $ref: "#/components/parameters/RequestIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveDraftRequest"
      responses:
        "200":
          description: Updated task with incremented version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnnotationTask"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
  /v1/annotation/tasks/{task_id}/submit:
    post:
      tags: [Tasks]
      operationId: submitAnnotationTask
      parameters:
        - $ref: "#/components/parameters/TaskId"
        - $ref: "#/components/parameters/RequestIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitTaskRequest"
      responses:
        "200":
          description: Task submitted for review.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnnotationTask"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/AnnotationValidationError"
  /v1/annotation/tasks/{task_id}/review:
    post:
      tags: [Tasks]
      operationId: reviewAnnotationTask
      parameters:
        - $ref: "#/components/parameters/TaskId"
        - $ref: "#/components/parameters/RequestIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewTaskRequest"
      responses:
        "200":
          description: Reviewed task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnnotationTask"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/AnnotationValidationError"
  /v1/annotation/tasks/{task_id}/prompt-enrichments:
    post:
      tags: [Tasks]
      operationId: createPromptEnrichment
      parameters:
        - $ref: "#/components/parameters/TaskId"
        - $ref: "#/components/parameters/RequestIdHeader"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePromptEnrichmentRequest"
      responses:
        "202":
          description: Prompt enrichment operation accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationAccepted"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/QueueFull"
  /v1/annotation/tasks/{task_id}/mask-candidates:
    post:
      tags: [Tasks]
      operationId: createMaskCandidate
      parameters:
        - $ref: "#/components/parameters/TaskId"
        - $ref: "#/components/parameters/RequestIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMaskCandidateRequest"
      responses:
        "202":
          description: SAM mask generation operation accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationAccepted"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
  /v1/annotation/tasks/{task_id}/artifacts/{artifact_type}:
    get:
      tags: [Tasks]
      operationId: getTaskArtifact
      parameters:
        - $ref: "#/components/parameters/TaskId"
        - $ref: "#/components/parameters/RequestIdHeader"
        - name: artifact_type
          in: path
          required: true
          schema:
            type: string
            enum: [detections, mask, mask-overlay, crop]
      responses:
        "200":
          description: Task image artifact.
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/annotation/operations/{operation_id}:
    get:
      tags: [Tasks]
      operationId: getAnnotationOperation
      parameters:
        - name: operation_id
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/RequestIdHeader"
      responses:
        "200":
          description: Asynchronous mask or prompt operation status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnnotationOperation"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/annotation/releases:
    post:
      tags: [Releases]
      operationId: createAnnotationRelease
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReleaseRequest"
      responses:
        "202":
          description: Release build accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Release"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
  /v1/annotation/releases/{release_id}:
    get:
      tags: [Releases]
      operationId: getAnnotationRelease
      parameters:
        - $ref: "#/components/parameters/ReleaseId"
        - $ref: "#/components/parameters/RequestIdHeader"
      responses:
        "200":
          description: Release build status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Release"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/annotation/releases/{release_id}/manifest:
    get:
      tags: [Releases]
      operationId: getAnnotationReleaseManifest
      parameters:
        - $ref: "#/components/parameters/ReleaseId"
        - $ref: "#/components/parameters/RequestIdHeader"
      responses:
        "200":
          description: Immutable release manifest.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/annotation/releases/{release_id}/archive:
    get:
      tags: [Releases]
      operationId: getAnnotationReleaseArchive
      parameters:
        - $ref: "#/components/parameters/ReleaseId"
        - $ref: "#/components/parameters/RequestIdHeader"
      responses:
        "200":
          description: Immutable ReasonSeg release archive.
          content:
            application/zip:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
  headers:
    RequestId:
      description: Request correlation ID.
      schema:
        type: string
        maxLength: 128
  parameters:
    RequestIdHeader:
      name: X-Request-ID
      in: header
      required: false
      schema:
        type: string
        maxLength: 128
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        minLength: 8
        maxLength: 128
    AssetId:
      name: asset_id
      in: path
      required: true
      schema:
        type: string
    JobId:
      name: job_id
      in: path
      required: true
      schema:
        type: string
    TaskId:
      name: task_id
      in: path
      required: true
      schema:
        type: string
    ReleaseId:
      name: release_id
      in: path
      required: true
      schema:
        type: string
  responses:
    ValidationError:
      description: Request fields are invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    AnnotationValidationError:
      description: Annotation content failed semantic or geometry validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Version, idempotency, or state transition conflict.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RequestTooLarge:
      description: Request body or decoded image is too large.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnsupportedMediaType:
      description: Uploaded file or request media type is unsupported.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    QueueFull:
      description: Asynchronous or GPU work queue is full.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: Model runtime or downstream service is unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    ReadinessResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        dependencies:
          type: object
          additionalProperties:
            type: string
    ErrorDetail:
      type: object
      required: [reason]
      properties:
        field:
          type: string
          nullable: true
        reason:
          type: string
    ErrorResponse:
      type: object
      required: [code, message, details]
      properties:
        request_id:
          type: string
          nullable: true
        code:
          type: string
          enum:
            - validation_error
            - annotation_validation_failed
            - unauthorized
            - forbidden
            - not_found
            - version_conflict
            - idempotency_conflict
            - invalid_state_transition
            - unsupported_media_type
            - request_too_large
            - queue_full
            - model_unavailable
            - downstream_unavailable
            - internal_error
        message:
          type: string
        details:
          type: array
          items:
            $ref: "#/components/schemas/ErrorDetail"
    AnnotationCategory:
      type: string
      enum:
        - helmet_missing
        - no_helmet
        - no_jacket
        - harness_missing
        - equipment_proximity
        - opening_unprotected
        - guardrail_missing
        - poor_housekeeping
        - safe
        - unsafe
    Asset:
      type: object
      required:
        - asset_id
        - group_id
        - width
        - height
        - sha256
        - media_type
        - content_url
        - created_at
      properties:
        asset_id:
          type: string
        source_id:
          type: string
          nullable: true
        group_id:
          type: string
        width:
          type: integer
          minimum: 1
        height:
          type: integer
          minimum: 1
        sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
        media_type:
          type: string
          enum: [image/jpeg, image/png]
        content_url:
          type: string
        duplicate_of:
          type: string
          nullable: true
        metadata:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
    JobStatus:
      type: string
      enum: [queued, running, succeeded, partial_failed, failed, cancelled]
    PipelineStage:
      type: string
      enum:
        - grounding_dino
        - hazard_rules
        - sam
        - qwen_facts
        - qwen_prompts
        - build_review_tasks
    StageStatus:
      type: string
      enum: [pending, running, succeeded, failed, skipped]
    StageResult:
      type: object
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/StageStatus"
        started_at:
          type: string
          format: date-time
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true
        message:
          type: string
          nullable: true
    JobOptions:
      type: object
      properties:
        generate_masks:
          type: boolean
          default: true
        enrich_prompts:
          type: boolean
          default: true
        prompt_count:
          type: integer
          enum: [6]
          default: 6
        stop_after:
          allOf:
            - $ref: "#/components/schemas/PipelineStage"
          nullable: true
          description: |
            Optional staged-execution boundary. GroundingDINO Worker claims
            grounding_dino or hazard_rules jobs; either value requires
            generate_masks=false and enrich_prompts=false. Omit stop_after
            for the complete Pipeline Worker; both output flags must then be
            true.
    CreateJobRequest:
      type: object
      required: [asset_ids, requested_categories, pipeline_version]
      properties:
        asset_ids:
          type: array
          minItems: 1
          maxItems: 500
          uniqueItems: true
          items:
            type: string
        requested_categories:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/AnnotationCategory"
        pipeline_version:
          type: string
          minLength: 1
          maxLength: 128
        options:
          $ref: "#/components/schemas/JobOptions"
    JobProgress:
      type: object
      required: [total_assets, completed_assets, generated_tasks]
      properties:
        total_assets:
          type: integer
          minimum: 0
        completed_assets:
          type: integer
          minimum: 0
        generated_tasks:
          type: integer
          minimum: 0
    JobError:
      type: object
      required: [code, message]
      properties:
        asset_id:
          type: string
          nullable: true
        stage:
          allOf:
            - $ref: "#/components/schemas/PipelineStage"
          nullable: true
        code:
          type: string
        message:
          type: string
    Job:
      type: object
      required:
        - job_id
        - status
        - pipeline_version
        - progress
        - stages
        - task_ids
        - errors
        - created_at
      properties:
        job_id:
          type: string
        status:
          $ref: "#/components/schemas/JobStatus"
        stage:
          allOf:
            - $ref: "#/components/schemas/PipelineStage"
          nullable: true
        pipeline_version:
          type: string
        progress:
          $ref: "#/components/schemas/JobProgress"
        stages:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/StageResult"
        task_ids:
          type: array
          items:
            type: string
        errors:
          type: array
          items:
            $ref: "#/components/schemas/JobError"
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
