              "grounding_dino"
            ],
            "title": "Stage"
          },
          "pipeline_version": {
            "type": "string",
            "title": "Pipeline Version"
          },
          "grounding_prompt": {
            "type": "string",
            "title": "Grounding Prompt"
          },
          "progress": {
            "$ref": "#/components/schemas/DetectionJobProgress"
          },
          "stages": {
            "additionalProperties": {
              "$ref": "#/components/schemas/StageResult"
            },
            "type": "object",
            "title": "Stages"
          },
          "errors": {
